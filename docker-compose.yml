version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: "jobqueue-postgres"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: job_queue

    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data 
  
  redis:
    image: redis:alpine
    container_name: "job_queue-redis"

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data 

volumes:
  postgres_data:
  redis_data:
